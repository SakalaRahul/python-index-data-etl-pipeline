services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: indexdb
      POSTGRES_USER: index_user
      POSTGRES_PASSWORD: index_pass
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U index_user -d indexdb"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
